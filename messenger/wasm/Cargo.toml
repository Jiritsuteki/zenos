[package]
name = "zenos-signal-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Signal's own libsignal protocol (the same version ZENOS Messages uses on the PC), compiled for the browser"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libsignal-protocol = { git = "https://github.com/signalapp/libsignal.git", tag = "v0.105.1" }
wasm-bindgen = "0.2"
futures = { version = "0.3", default-features = false, features = ["executor"] }
rand = "0.9"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
